services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["npm", "run", "db:migrate"]
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["npm", "run", "start"]
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["npm", "run", "start:scheduler"]
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: unless-stopped
